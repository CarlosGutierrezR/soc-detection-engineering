<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<style>
text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:30px;font-weight:700}.h{font-size:22px;font-weight:700}.b{font-size:18px}.mono{font-family:monospace;font-size:16px}.ok{fill:#0f6b3f}.bad{fill:#9b3a24}.box{fill:#f7f9fb;stroke:#b8c4d0;stroke-width:2}.rule{font-size:30px;font-weight:700}
</style>
<rect width="1200" height="760" fill="white"/>
<text x="40" y="55" class="title">LAB-DET-001 — Custom rule tuning and final validation</text>
<rect x="40" y="95" width="1120" height="175" rx="14" class="box"/>
<text x="70" y="140" class="h">V1 — gap corrected, but precision issue discovered</text>
<text x="70" y="180" class="mono">Pattern: powershell.exe ... -enc (whitespace OR end-of-line)</text>
<text x="70" y="218" class="b">Valid -enc &lt;BASE64&gt; -> 100100 / Level 12</text>
<text x="600" y="218" class="b bad">Empty -enc -> 100100 / Level 12 (overbroad match)</text>

<rect x="40" y="305" width="540" height="365" rx="14" class="box"/>
<text x="70" y="350" class="h">V2 positive — TC-02-V2</text>
<text x="70" y="395" class="mono">-enc &lt;Base64-looking argument&gt;</text>
<text x="70" y="455" class="rule ok">100100 / Level 12</text>
<text x="70" y="505" class="b">Group: local, windows, sysmon, lab_det_001</text>
<text x="70" y="545" class="b">ATT&amp;CK: T1059.001</text>
<text x="70" y="615" class="h ok">PASS</text>

<rect x="620" y="305" width="540" height="365" rx="14" class="box"/>
<text x="650" y="350" class="h">V2 negative — NEG-V2</text>
<text x="650" y="395" class="mono">powershell.exe -NoProfile -enc</text>
<text x="650" y="455" class="rule">92027 / Level 4</text>
<text x="650" y="505" class="b">Custom rule 100100 absent</text>
<text x="650" y="545" class="b">V1 overbroad match removed</text>
<text x="650" y="615" class="h ok">PASS</text>
<text x="40" y="725" class="b">Derived from primary Wazuh screenshots captured during the controlled tests; operational identifiers removed.</text>
</svg>