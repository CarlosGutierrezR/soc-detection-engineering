<text x="416" y="353" class="f" font-size="21" font-weight="700" fill="#e6edf3">Precisión</text>
<text x="374" y="400" class="f" font-size="18" fill="#9fb0c8">V1 alertaba también</text>
<text x="374" y="426" class="f" font-size="18" fill="#9fb0c8">con -enc sin argumento</text>
