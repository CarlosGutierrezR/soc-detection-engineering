<text x="416" y="139" class="f" font-size="21" font-weight="700" fill="#e6edf3">Línea base</text>
<text x="374" y="186" class="f" font-size="18" fill="#9fb0c8">PowerShell benigno</text>
<text x="374" y="212" class="f" font-size="18" fill="#9fb0c8">→ 92027 · nivel 4</text>
<path d="M628 171.0 h20" stroke="#5b6b85" stroke-width="3"/><path d="M652 171.0 l-10 -7 v14z" fill="#5b6b85"/>
