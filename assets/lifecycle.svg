<text x="994" y="352" text-anchor="middle" class="f" font-size="17" font-weight="700" fill="#0b1220">8</text>
<text x="1024" y="353" class="f" font-size="21" font-weight="700" fill="#e6edf3">Revalidación</text>
<text x="982" y="400" class="f" font-size="18" fill="#9fb0c8">Positivo ✓  Negativo ✓</text>
<text x="982" y="426" class="f" font-size="18" fill="#9fb0c8">wazuh-analysisd -t = 0</text>
