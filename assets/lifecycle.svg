<text x="112" y="139" class="f" font-size="21" font-weight="700" fill="#e6edf3">Hipótesis</text>
<text x="70" y="186" class="f" font-size="18" fill="#9fb0c8">¿-enc se clasifica igual</text>
<text x="70" y="212" class="f" font-size="18" fill="#9fb0c8">que -EncodedCommand?</text>
