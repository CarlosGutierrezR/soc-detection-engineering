<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="492" viewBox="0 0 1280 492" role="img" aria-labelledby="t d">
<title id="t">Ciclo de ingeniería de detección de LAB-DET-001</title>
<desc id="d">Ocho pasos: hipótesis, línea base, reproducir gap, causa raíz, regla V1, problema de precisión, ajuste V2 y revalidación.</desc>
<style>.f{font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif}</style>
<rect width="1280" height="492" rx="18" fill="#0b1220"/>
<text x="48" y="58" class="f" font-size="28" font-weight="700" fill="#e6edf3">Ciclo de ingeniería: no basta con que la regla «salte»</text>
