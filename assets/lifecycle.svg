<circle cx="690" cy="132" r="18" fill="#38bdf8"/>
<text x="690" y="138" text-anchor="middle" class="f" font-size="17" font-weight="700" fill="#0b1220">3</text>
<text x="720" y="139" class="f" font-size="21" font-weight="700" fill="#e6edf3">Reproducir gap</text>
<text x="678" y="186" class="f" font-size="18" fill="#9fb0c8">-enc &lt;BASE64&gt;</text>
<text x="678" y="212" class="f" font-size="18" fill="#9fb0c8">→ 92027 · nivel 4</text>
<path d="M932 171.0 h20" stroke="#5b6b85" stroke-width="3"/><path d="M956 171.0 l-10 -7 v14z" fill="#5b6b85"/>
