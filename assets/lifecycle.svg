<circle cx="994" cy="132" r="18" fill="#38bdf8"/>
<text x="994" y="138" text-anchor="middle" class="f" font-size="17" font-weight="700" fill="#0b1220">4</text>
<text x="1024" y="139" class="f" font-size="21" font-weight="700" fill="#e6edf3">Causa raíz</text>
<text x="982" y="186" class="f" font-size="18" fill="#9fb0c8">Token enc ausente</text>
<text x="982" y="212" class="f" font-size="18" fill="#9fb0c8">en la regex de 92057</text>
<rect x="48" y="310" width="272" height="150" rx="14" fill="#111a2e" stroke="#24324d" stroke-width="2"/>
<circle cx="82" cy="346" r="18" fill="#38bdf8"/>
<text x="82" y="352" text-anchor="middle" class="f" font-size="17" font-weight="700" fill="#0b1220">5</text>
<text x="112" y="353" class="f" font-size="21" font-weight="700" fill="#e6edf3">Regla V1</text>
<text x="70" y="400" class="f" font-size="18" fill="#9fb0c8">Regla propia 100100</text>
<text x="70" y="426" class="f" font-size="18" fill="#9fb0c8">sin tocar reglas nativas</text>
